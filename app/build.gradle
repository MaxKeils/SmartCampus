plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'ru.smartcampus'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId 'ru.smartcampus'
        minSdk 28
        targetSdk 37
        versionCode 2
        versionName '0.1.1-rc.1'
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.11.01')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.datastore:datastore-preferences:1.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.1'
    implementation 'androidx.navigation3:navigation3-runtime:1.2.2'
    implementation 'androidx.navigation3:navigation3-ui:1.2.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'
    testImplementation 'junit:junit:4.13.2'
}
